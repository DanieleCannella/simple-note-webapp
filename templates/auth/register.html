<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina di Registrazione</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="register-container">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form class="register-form" id="register-form" method="POST">
            <h1>Registrati</h1>
            <div class="input-group">
                <label for="username">Nome Utente</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group password-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="Mostra password" title="Mostra/Nascondi password">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="input-group password-group">
                <label for="confirm-password">Conferma Password</label>
                <div class="input-with-icon">
                    <input type="password" id="confirm-password" name="confirm-password" required>
                    <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Mostra password" title="Mostra/Nascondi password">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
            <p id="password-error" class="alert alert-error" style="display:none;">Le password non coincidono.</p>
            <button type="submit" class="btn btn-success btn-block">Registrati</button>
            <div class="bottom-text">
              <p>Hai già un account? <a href="{{ url_for('login')}}">Accedi</a></p>
            </div>
        </form>
    </div>
    <script>
    (function () {
        const form = document.getElementById('register-form');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm-password');
        const errorEl = document.getElementById('password-error');
        const svgEye = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        const svgEyeOff = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.585 10.585A3 3 0 0 0 12 15a3 3 0 0 0 2.828-1.999M9.878 4.49A10.86 10.86 0 0 1 12 4c5 0 9.27 3.11 11 7a12.87 12.87 0 0 1-3.113 4.297M6.223 6.223C3.98 7.648 2.318 9.595 1 12c1.73 3.89 6 7 11 7 1.045 0 2.06-.135 3.023-.387" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        // Timer per ritardare la validazione
        let typingTimer;
        const doneTypingInterval = 1000; // tempo in ms (1 secondo)

        function updateValidity() {
            const match = passwordInput.value === confirmInput.value;
            if (!match && confirmInput.value.length > 0) {
                confirmInput.setCustomValidity('Le password non coincidono.');
                if (errorEl) errorEl.style.display = 'block';
            } else {
                confirmInput.setCustomValidity('');
                if (errorEl) errorEl.style.display = 'none';
            }
        }

        // Valida subito quando la password principale cambia
        passwordInput.addEventListener('input', updateValidity);

        // Valida con un ritardo quando l'utente scrive nel campo di conferma
        confirmInput.addEventListener('input', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(updateValidity, doneTypingInterval);
        });

        document.querySelectorAll('.toggle-password').forEach(function(btn){
            btn.addEventListener('click', function(){
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                const isHidden = input.type === 'password';
                input.type = isHidden ? 'text' : 'password';
                this.setAttribute('aria-label', isHidden ? 'Nascondi password' : 'Mostra password');
                this.innerHTML = isHidden ? svgEyeOff : svgEye;
                this.title = isHidden ? 'Nascondi password' : 'Mostra password';
            });
        });

        form.addEventListener('submit', function (e) {
            updateValidity(); // Esegue un'ultima validazione prima dell'invio
            if (!form.checkValidity()) {
                e.preventDefault();
                e.stopPropagation();
            }
        });
    })();
    </script>
</body>
</html>
